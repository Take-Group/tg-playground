[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tg-playground-backend"
version = "0.1.0"
description = "TG Playground Backend"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.138",
    "uvicorn[standard]>=0.49",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "redis>=8.0",
    "temporalio>=1.29",
    "structlog>=26.1",
    "httpx>=0.28",
]

[project.scripts]
serve = "app.main:run"
worker = "app.temporal.worker:run"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
