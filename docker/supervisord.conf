; Supervisor uruchamia trzy procesy w jednym kontenerze:
;   api      — FastAPI (port 8000)
;   worker   — worker Temporal
;   frontend — Next.js w trybie standalone (port 3000)
;
; Wszystkie logi lecą na stdout kontenera, więc `docker compose logs` pokazuje
; komplet. Prefiks w logach mówi, który proces coś napisał.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
user=app

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:api]
command=/app/backend/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/app/backend
autostart=true
autorestart=true
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
stdout_logfile_backups=0

[program:worker]
command=/app/backend/.venv/bin/worker
directory=/app/backend
autostart=true
autorestart=true
startretries=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
stdout_logfile_backups=0

[program:frontend]
command=/usr/local/bin/bun server.js
directory=/app/frontend
autostart=true
autorestart=true
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
stdout_logfile_backups=0
