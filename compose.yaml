name: tg-playground

services:
  postgres:
    build:
      context: .
      target: postgres
    command: ["postgres", "-c", "timezone=Europe/Warsaw", "-c", "log_timezone=Europe/Warsaw"]
    environment:
      TZ: Europe/Warsaw
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tg_playground
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tg_playground"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    build:
      context: .
      target: redis
    environment:
      TZ: Europe/Warsaw
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  temporal-schema-setup:
    image: temporalio/admin-tools:1.31.2
    environment:
      TZ: Europe/Warsaw
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: postgres
      SQL_PASSWORD: postgres
    entrypoint: ["/bin/sh"]
    command: ["/scripts/setup-postgres.sh"]
    volumes:
      - ./backend/temporal/scripts:/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy

  temporal:
    image: temporalio/server:1.31.2
    environment:
      TZ: Europe/Warsaw
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: postgres
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    volumes:
      - ./backend/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    depends_on:
      temporal-schema-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "7233"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s

  temporal-create-namespace:
    image: temporalio/admin-tools:1.31.2
    environment:
      TZ: Europe/Warsaw
      TEMPORAL_ADDRESS: temporal:7233
      DEFAULT_NAMESPACE: default
      DEFAULT_NAMESPACE_RETENTION: 24h
    entrypoint: ["/bin/sh"]
    command: ["/scripts/create-namespace.sh"]
    volumes:
      - ./backend/temporal/scripts:/scripts:ro
    depends_on:
      temporal:
        condition: service_healthy

  # Jeden kontener: migracje (przy starcie), API, worker Temporal i frontend.
  app:
    build:
      context: .
      target: app
    environment:
      TZ: Europe/Warsaw
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/tg_playground
      REDIS_URL: redis://redis:6379/0
      TEMPORAL_HOST: temporal:7233
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal-create-namespace:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  pgdata:
    # Nazwa zachowana z poprzedniego układu — dzięki temu istniejące dane
    # deweloperskie przetrwały scalenie stosów.
    name: tg-playground-backend_pgdata
